<h1 style="margin:0 0 6px;color:#12307f;font-size:22px">New admission enquiry</h1>
<p style="margin:0 0 20px;color:#5e6a8c">Reference {{reference}} | Received {{receivedAt}}</p>
<table role="presentation" style="width:100%;border-collapse:collapse;font-size:14px">
  <tr><td style="padding:10px;border-bottom:1px solid #eef2f9;font-weight:700">Student</td><td style="padding:10px;border-bottom:1px solid #eef2f9">{{studentName}}</td></tr>
  <tr><td style="padding:10px;border-bottom:1px solid #eef2f9;font-weight:700">Parent</td><td style="padding:10px;border-bottom:1px solid #eef2f9">{{parentName}}</td></tr>
  <tr><td style="padding:10px;border-bottom:1px solid #eef2f9;font-weight:700">Class</td><td style="padding:10px;border-bottom:1px solid #eef2f9">{{classGroup}}</td></tr>
  <tr><td style="padding:10px;border-bottom:1px solid #eef2f9;font-weight:700">Phone</td><td style="padding:10px;border-bottom:1px solid #eef2f9"><a href="tel:{{phone}}" style="color:#12307f">{{phone}}</a></td></tr>
  <tr><td style="padding:10px;border-bottom:1px solid #eef2f9;font-weight:700">Email</td><td style="padding:10px;border-bottom:1px solid #eef2f9">{{email}}</td></tr>
  <tr><td style="padding:10px;border-bottom:1px solid #eef2f9;font-weight:700;vertical-align:top">Address</td><td style="padding:10px;border-bottom:1px solid #eef2f9">{{address}}</td></tr>
  <tr><td style="padding:10px;font-weight:700;vertical-align:top">Message</td><td style="padding:10px">{{message}}</td></tr>
</table>
