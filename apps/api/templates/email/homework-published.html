<h1 style="margin:0 0 18px;color:#12307f;font-size:22px">New homework published</h1>
<p style="margin:0 0 18px">New homework has been published for <strong>{{classGroup}}</strong>.</p>
<div style="background:#e7f3fd;border-radius:10px;padding:16px 18px;margin:0 0 20px">
  <p style="margin:0 0 6px"><strong>Title:</strong> {{title}}</p>
  <p style="margin:0 0 6px"><strong>Subject:</strong> {{subject}}</p>
  <p style="margin:0"><strong>Due date:</strong> {{dueDate}}</p>
</div>
<p style="margin:0;text-align:center"><a href="{{portalUrl}}" style="display:inline-block;background:#e3a81c;color:#0b2059;font-weight:800;text-decoration:none;padding:12px 26px;border-radius:999px">View homework</a></p>
