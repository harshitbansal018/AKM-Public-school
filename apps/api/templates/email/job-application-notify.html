<h1 style="margin:0 0 6px;color:#12307f;font-size:22px">New job application</h1>
<p style="margin:0 0 20px;color:#5e6a8c">{{reference}} | Received {{receivedAt}}</p>
<table role="presentation" style="width:100%;border-collapse:collapse;font-size:14px">
  <tr><td style="padding:10px;border-bottom:1px solid #eef2f9;font-weight:700">Applicant</td><td style="padding:10px;border-bottom:1px solid #eef2f9">{{applicantName}}</td></tr>
  <tr><td style="padding:10px;border-bottom:1px solid #eef2f9;font-weight:700">Position</td><td style="padding:10px;border-bottom:1px solid #eef2f9">{{position}}</td></tr>
  <tr><td style="padding:10px;border-bottom:1px solid #eef2f9;font-weight:700">Subject</td><td style="padding:10px;border-bottom:1px solid #eef2f9">{{subject}}</td></tr>
  <tr><td style="padding:10px;border-bottom:1px solid #eef2f9;font-weight:700">Qualification</td><td style="padding:10px;border-bottom:1px solid #eef2f9">{{qualification}}</td></tr>
  <tr><td style="padding:10px;border-bottom:1px solid #eef2f9;font-weight:700">Experience</td><td style="padding:10px;border-bottom:1px solid #eef2f9">{{experience}}</td></tr>
  <tr><td style="padding:10px;border-bottom:1px solid #eef2f9;font-weight:700">Phone</td><td style="padding:10px;border-bottom:1px solid #eef2f9">{{phone}}</td></tr>
  <tr><td style="padding:10px;border-bottom:1px solid #eef2f9;font-weight:700">Email</td><td style="padding:10px;border-bottom:1px solid #eef2f9">{{email}}</td></tr>
  <tr><td style="padding:10px;font-weight:700">CV</td><td style="padding:10px">{{resumeStatus}}</td></tr>
</table>
<p style="margin:22px 0 0;text-align:center"><a href="{{adminUrl}}" style="display:inline-block;background:#e3a81c;color:#0b2059;font-weight:800;text-decoration:none;padding:12px 26px;border-radius:999px">Review application</a></p>
