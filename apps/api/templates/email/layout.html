<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f4f7fc;padding:24px 12px;font-family:'Segoe UI',Arial,sans-serif;color:#1a2340">
    <table role="presentation" style="width:100%;border-collapse:collapse"><tr><td align="center">
      <table role="presentation" style="width:100%;max-width:600px;border-collapse:collapse;background:#ffffff;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(18,48,127,.10)">
        <tr><td style="background:#12307f;padding:22px 28px;text-align:center;color:#ffffff">
          <a href="{{websiteUrl}}" style="text-decoration:none;color:#ffffff">
            <img src="{{logoUrl}}" width="72" height="72" alt="{{schoolName}} logo" style="display:block;margin:0 auto 10px;width:72px;height:72px;object-fit:contain;background:#ffffff;border-radius:50%;padding:4px">
            <div style="font-size:20px;font-weight:800;line-height:1.3">{{schoolName}}</div>
            <div style="margin-top:5px;font-size:12px;color:#c9dcf7">Nursery to Class 12 | HPBOSE Affiliated</div>
          </a>
        </td></tr>
        <tr><td style="padding:28px;font-size:14px;line-height:1.7">{{content}}</td></tr>
        <tr><td style="background:#0b2059;padding:16px 28px;text-align:center;color:#afc7ec;font-size:12px;line-height:1.6">
          This is an official email from {{schoolName}}.<br>
          &copy; {{currentYear}} {{schoolName}}. Please do not reply to automated messages.
        </td></tr>
      </table>
    </td></tr></table>
  </body>
</html>
