<p style="margin:0 0 16px;color:#5e6a8c">{{category}} | {{noticeDate}}</p>
<div style="background:#f7f9fd;border-left:4px solid #12307f;border-radius:8px;padding:16px 18px;margin:0 0 20px">{{excerpt}}</div>
